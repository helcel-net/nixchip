name: Check new upstream majors

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for new major releases
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "New upstream major versions"
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Update tracking issue
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body > previous.md
            python3 scripts/check-new-majors.py --previous-body previous.md > body.md
          else
            python3 scripts/check-new-majors.py > body.md
          fi

          if [ -s body.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every upstream major now has a slot."
          fi
